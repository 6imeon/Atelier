<!-- FEATURE TAB SWITCHER: Horizontal tab rail, click swaps featured media + copy below -->
<!-- Pattern: Tabs row with animated underline indicator; active tab fades in its paired panel -->
<!-- Requires: Minimal JS (click handler) -->
<!-- Ref: https://stripe.com/payments -->
<!-- Ref: https://linear.app/features -->
<!-- Ref: https://vercel.com/home -->

<section class="fts-section" style="position:relative;padding:120px 40px;max-width:1200px;margin:0 auto">
  <header class="fts-head" style="text-align:center;margin-bottom:48px;max-width:720px;margin-left:auto;margin-right:auto">
    <span class="fts-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;opacity:0.65">[EYEBROW]</span>
    <h2 class="fts-title" style="font-size:clamp(32px,4.4vw,72px);font-weight:700;margin:12px 0 0;letter-spacing:-0.02em;line-height:1.05">[HEADLINE]</h2>
  </header>

  <div class="fts-tabs" role="tablist" style="position:relative;display:flex;justify-content:center;gap:40px;border-bottom:1px solid currentColor;border-color:rgba(128,128,128,0.3);margin-bottom:60px">
    <button class="fts-tab is-active" data-tab="0" role="tab" aria-selected="true" type="button" style="background:transparent;border:0;padding:20px 4px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1px">[TAB_1]</button>
    <button class="fts-tab" data-tab="1" role="tab" aria-selected="false" type="button" style="background:transparent;border:0;padding:20px 4px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1px;opacity:0.55">[TAB_2]</button>
    <button class="fts-tab" data-tab="2" role="tab" aria-selected="false" type="button" style="background:transparent;border:0;padding:20px 4px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1px;opacity:0.55">[TAB_3]</button>
    <button class="fts-tab" data-tab="3" role="tab" aria-selected="false" type="button" style="background:transparent;border:0;padding:20px 4px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:1px;opacity:0.55">[TAB_4]</button>
    <span class="fts-indicator" aria-hidden="true" style="position:absolute;bottom:-1px;height:2px;background:currentColor;transition:left 0.35s cubic-bezier(0.2,0.8,0.2,1), width 0.35s cubic-bezier(0.2,0.8,0.2,1)"></span>
  </div>

  <div class="fts-stage" style="position:relative;min-height:420px">
    <div class="fts-panel is-active" data-panel="0" style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;opacity:1">
      <div class="fts-panel-media" style="aspect-ratio:4/3;background-size:cover;background-position:center;border-radius:8px"></div>
      <div class="fts-panel-copy">
        <h3 style="font-size:clamp(24px,2.4vw,34px);font-weight:700;margin:0 0 16px;letter-spacing:-0.01em;line-height:1.15">[PANEL_TITLE_1]</h3>
        <p style="font-size:17px;line-height:1.6;margin:0 0 24px;opacity:0.8">[PANEL_BODY_1]</p>
        <a href="#" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:1px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px">[PANEL_CTA_1] →</a>
      </div>
    </div>
    <div class="fts-panel" data-panel="1" style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;opacity:0;pointer-events:none">
      <div class="fts-panel-media" style="aspect-ratio:4/3;background-size:cover;background-position:center;border-radius:8px"></div>
      <div class="fts-panel-copy">
        <h3 style="font-size:clamp(24px,2.4vw,34px);font-weight:700;margin:0 0 16px;letter-spacing:-0.01em;line-height:1.15">[PANEL_TITLE_2]</h3>
        <p style="font-size:17px;line-height:1.6;margin:0 0 24px;opacity:0.8">[PANEL_BODY_2]</p>
        <a href="#" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:1px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px">[PANEL_CTA_2] →</a>
      </div>
    </div>
    <div class="fts-panel" data-panel="2" style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;opacity:0;pointer-events:none">
      <div class="fts-panel-media" style="aspect-ratio:4/3;background-size:cover;background-position:center;border-radius:8px"></div>
      <div class="fts-panel-copy">
        <h3 style="font-size:clamp(24px,2.4vw,34px);font-weight:700;margin:0 0 16px;letter-spacing:-0.01em;line-height:1.15">[PANEL_TITLE_3]</h3>
        <p style="font-size:17px;line-height:1.6;margin:0 0 24px;opacity:0.8">[PANEL_BODY_3]</p>
        <a href="#" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:1px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px">[PANEL_CTA_3] →</a>
      </div>
    </div>
    <div class="fts-panel" data-panel="3" style="position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;opacity:0;pointer-events:none">
      <div class="fts-panel-media" style="aspect-ratio:4/3;background-size:cover;background-position:center;border-radius:8px"></div>
      <div class="fts-panel-copy">
        <h3 style="font-size:clamp(24px,2.4vw,34px);font-weight:700;margin:0 0 16px;letter-spacing:-0.01em;line-height:1.15">[PANEL_TITLE_4]</h3>
        <p style="font-size:17px;line-height:1.6;margin:0 0 24px;opacity:0.8">[PANEL_BODY_4]</p>
        <a href="#" style="display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:1px;text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:4px">[PANEL_CTA_4] →</a>
      </div>
    </div>
  </div>
</section>

<style>
.fts-section .fts-panel { transition: opacity 0.35s ease; }
.fts-section .fts-tab { transition: opacity 0.2s ease; }
.fts-section .fts-tab.is-active { opacity: 1 !important; }
@media (max-width: 800px) {
  .fts-section .fts-panel { grid-template-columns: 1fr !important; gap: 24px !important; }
  .fts-section .fts-tabs { overflow-x: auto; justify-content: flex-start; padding: 0 4px; }
}
@media (prefers-reduced-motion: reduce) {
  .fts-section .fts-panel, .fts-section .fts-tab, .fts-section .fts-indicator { transition: none !important; }
}
</style>

<script>
const ftsRoot = document.querySelector('.fts-section');
const ftsTabs = ftsRoot.querySelectorAll('.fts-tab');
const ftsPanels = ftsRoot.querySelectorAll('.fts-panel');
const ftsInd = ftsRoot.querySelector('.fts-indicator');

function ftsSetIndicator(btn) {
  const p = btn.parentElement.getBoundingClientRect();
  const r = btn.getBoundingClientRect();
  ftsInd.style.left = (r.left - p.left) + 'px';
  ftsInd.style.width = r.width + 'px';
}

ftsTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const idx = tab.dataset.tab;
    ftsTabs.forEach(t => { t.classList.remove('is-active'); t.setAttribute('aria-selected', 'false'); t.style.opacity = '0.55'; });
    tab.classList.add('is-active');
    tab.setAttribute('aria-selected', 'true');
    tab.style.opacity = '1';
    ftsPanels.forEach(p => {
      const active = p.dataset.panel === idx;
      p.classList.toggle('is-active', active);
      p.style.opacity = active ? '1' : '0';
      p.style.pointerEvents = active ? 'auto' : 'none';
    });
    ftsSetIndicator(tab);
  });
});

window.addEventListener('load', () => ftsSetIndicator(ftsTabs[0]));
window.addEventListener('resize', () => { const active = ftsRoot.querySelector('.fts-tab.is-active'); if (active) ftsSetIndicator(active); });
</script>
