<!-- CURSOR SPOTLIGHT MASK: Circle mask follows cursor, revealing a hidden layer beneath -->
<!-- Pattern: Dark overlay with a radial mask cutout that tracks pointer; reveal layer shows underneath -->
<!-- Requires: Minimal JS (pointer tracking via CSS variable) -->
<!-- Ref: https://www.awwwards.com/ -->
<!-- Ref: https://www.framer.com/ -->
<!-- Ref: https://www.activetheory.net/ -->

<section class="csm-section" style="position:relative;height:90vh;overflow:hidden;background:#0a0a0a;color:#fff">
  <div class="csm-reveal" data-layer="reveal" style="position:absolute;inset:0;background-size:cover;background-position:center;z-index:1"></div>
  <div class="csm-mask" data-mask="true" aria-hidden="true" style="position:absolute;inset:0;background:#0a0a0a;z-index:2;-webkit-mask-image:radial-gradient(circle 220px at var(--csm-x, 50%) var(--csm-y, 50%), transparent 0%, #000 100%);mask-image:radial-gradient(circle 220px at var(--csm-x, 50%) var(--csm-y, 50%), transparent 0%, #000 100%);pointer-events:none"></div>
  <div class="csm-content" style="position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;pointer-events:none">
    <span class="csm-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;opacity:0.75">[EYEBROW]</span>
    <h1 class="csm-title" style="font-size:clamp(48px,9vw,140px);font-weight:900;letter-spacing:-0.03em;line-height:0.95;margin:20px 0 16px;mix-blend-mode:difference;color:#fff;max-width:1000px">[HEADLINE]</h1>
    <p class="csm-body" style="font-size:clamp(14px,1.2vw,18px);line-height:1.6;margin:0;max-width:480px;opacity:0.7">[BODY]</p>
  </div>
</section>

<style>
@media (prefers-reduced-motion: reduce) {
  .csm-section .csm-mask { -webkit-mask-image: none !important; mask-image: none !important; opacity: 0.55 !important; }
}
</style>

<script>
const csmRoot = document.querySelector('.csm-section');
csmRoot.addEventListener('pointermove', (e) => {
  const r = csmRoot.getBoundingClientRect();
  const x = ((e.clientX - r.left) / r.width) * 100;
  const y = ((e.clientY - r.top) / r.height) * 100;
  csmRoot.style.setProperty('--csm-x', x + '%');
  csmRoot.style.setProperty('--csm-y', y + '%');
});
csmRoot.addEventListener('pointerleave', () => {
  csmRoot.style.setProperty('--csm-x', '50%');
  csmRoot.style.setProperty('--csm-y', '50%');
});
</script>
