<!-- LOGO WALL ROTATOR: Client/partner logo grid with subtle infinite drift + hover greyscale swap -->
<!-- Pattern: Two rows of logos drifting in opposite directions; hover desaturates siblings -->
<!-- Requires: CSS only (keyframes) -->
<!-- Ref: https://stripe.com/customers -->
<!-- Ref: https://linear.app/customers -->
<!-- Ref: https://vercel.com/home -->

<section class="lwr-section" style="position:relative;padding:80px 0;overflow:hidden">
  <header class="lwr-head" style="text-align:center;margin-bottom:48px;padding:0 40px">
    <span class="lwr-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase">[EYEBROW]</span>
    <h2 class="lwr-title" style="font-size:clamp(22px,2.4vw,34px);font-weight:600;margin:10px 0 0;opacity:0.85">[HEADLINE]</h2>

  <div class="lwr-viewport" style="position:relative;width:100%;mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent)">
    <div class="lwr-track" data-direction="left" style="display:flex;gap:60px;align-items:center;width:max-content;animation:lwr-scroll-left 40s linear infinite">
      <div class="lwr-logo" data-logo="0" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_1]</div>
      <div class="lwr-logo" data-logo="1" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_2]</div>
      <div class="lwr-logo" data-logo="2" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_3]</div>
      <div class="lwr-logo" data-logo="3" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_4]</div>
      <div class="lwr-logo" data-logo="4" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_5]</div>
      <div class="lwr-logo" data-logo="5" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_6]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_1]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_2]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_3]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_4]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_5]</div>
      <div class="lwr-logo" aria-hidden="true" style="flex:0 0 auto;height:48px;display:flex;align-items:center;opacity:0.6">[LOGO_6]</div>
    </div>
  </div>
</section>

<style>
@keyframes lwr-scroll-left {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
.lwr-section .lwr-logo { transition: opacity 0.25s ease; }
.lwr-section .lwr-track:hover .lwr-logo { opacity: 0.3; }
.lwr-section .lwr-track:hover .lwr-logo:hover { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .lwr-section .lwr-track { animation: none !important; }
  .lwr-section .lwr-viewport { mask-image: none !important; -webkit-mask-image: none !important; overflow: hidden !important; }
  .lwr-section .lwr-track { flex-wrap: wrap !important; justify-content: center !important; width: 100% !important; padding: 0 40px !important; }
}
</style>
