<!-- QUOTE PULL SERIF: Oversized serif pull-quote with author block and decorative mark -->
<!-- Pattern: Giant serif italic quote, led by big open-quote glyph; author + role beneath -->
<!-- Requires: CSS only -->
<!-- Ref: https://www.theverge.com/ -->
<!-- Ref: https://www.newyorker.com/ -->
<!-- Ref: https://linear.app/customers -->

<section class="qps-section" style="position:relative;padding:140px 40px;max-width:1000px;margin:0 auto">
  <header class="qps-head" data-head="optional" style="margin-bottom:48px">
    <span class="qps-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase">[EYEBROW]</span>
  </header>

  <figure class="qps-figure" style="margin:0;position:relative">
    <span class="qps-mark" aria-hidden="true" style="position:absolute;top:-30px;left:-10px;font-family:Georgia,'Times New Roman',serif;font-size:clamp(120px,18vw,260px);line-height:0.8;opacity:0.12;font-style:italic;pointer-events:none">“</span>
    <blockquote class="qps-quote" cite="#" style="margin:0;position:relative;z-index:1">
      <p style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(28px,4vw,56px);font-weight:400;line-height:1.2;letter-spacing:-0.01em;margin:0">[QUOTE]</p>
    </blockquote>
    <figcaption class="qps-cite" style="display:flex;align-items:center;gap:20px;margin-top:40px">
      <div class="qps-avatar" data-avatar="optional" aria-hidden="true" style="width:56px;height:56px;border-radius:50%;background-size:cover;background-position:center;flex-shrink:0;background-color:rgba(128,128,128,0.15)"></div>
      <div class="qps-cite-text">
        <div class="qps-cite-name" style="font-size:16px;font-weight:600;margin:0">[AUTHOR_NAME]</div>
        <div class="qps-cite-role" style="font-size:14px;margin:2px 0 0;opacity:0.65">[AUTHOR_ROLE]</div>
      </div>
    </figcaption>
  </figure>
</section>
