<!-- SPLIT PANEL HERO: Two-panel layout with scroll-triggered reveal -->
<!-- Pattern: Left image panel + right content panel, image parallax on scroll -->
<!-- Requires: GSAP + ScrollTrigger -->
<!-- Ref: https://report.adidas-group.com/2024/en/ -->

<section class="split-hero" style="position:relative;min-height:100vh;display:flex;overflow:hidden">
  <!-- Image panel -->
  <div class="split-image" style="flex:1;position:relative;overflow:hidden">
    <div class="split-image-inner" style="position:absolute;inset:-10%;background-size:cover;background-position:center"></div>
    <div class="split-overlay" style="position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(0,0,0,0.3))"></div>
  </div>

  <!-- Content panel -->
  <div class="split-content" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;position:relative">
    <span class="split-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:0;transform:translateY(20px)">[EYEBROW]</span>
    <h2 class="split-title" style="font-size:clamp(36px,5vw,72px);font-weight:700;line-height:1.05;margin:20px 0;opacity:0;transform:translateY(30px)">[HEADLINE]</h2>
    <p class="split-body" style="font-size:18px;line-height:1.6;max-width:480px;opacity:0;transform:translateY(20px)">[BODY]</p>
    <a href="#" class="split-cta" style="display:inline-block;margin-top:32px;padding:14px 36px;border:1px solid currentColor;text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:0;transform:translateY(20px);width:fit-content">[CTA]</a>
  </div>
</section>

<style>
@media (prefers-reduced-motion: reduce) {
  .split-eyebrow, .split-title, .split-body, .split-cta { opacity: 1 !important; transform: none !important; }
  .split-image-inner { transform: none !important; }
}
</style>

<script>
gsap.registerPlugin(ScrollTrigger);
const hero = document.querySelector('.split-hero');
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!prefersReducedMotion) {
  // Parallax on image
  gsap.to('.split-image-inner', {
    y: '15%',
    ease: 'none',
    scrollTrigger: { trigger: hero, start: 'top bottom', end: 'bottom top', scrub: true }
  });
}

// Content stagger reveal
const tl = gsap.timeline({
  scrollTrigger: { trigger: hero, start: 'top 70%', toggleActions: 'play none none reverse' }
});
tl.to('.split-eyebrow', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' })
  .to('.split-title', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out' }, '-=0.3')
  .to('.split-body', { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, '-=0.4')
  .to('.split-cta', { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, '-=0.3');
</script>
