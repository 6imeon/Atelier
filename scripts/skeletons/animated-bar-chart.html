<!-- ANIMATED BAR CHART: Horizontal bars draw in on scroll -->
<!-- Pattern: Data-driven horizontal bars animate width from 0 to target% on viewport entry -->
<!-- Requires: GSAP + ScrollTrigger -->
<!-- Ref: https://report.adidas-group.com/2024/en/ -->

<section class="bar-section" style="padding:100px 40px;position:relative;max-width:1200px;margin:0 auto">
  <div class="bar-header" style="margin-bottom:60px">
    <span class="bar-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase">[EYEBROW]</span>
    <h2 class="bar-title" style="font-size:clamp(32px,4vw,56px);font-weight:700;margin:12px 0 0">[HEADLINE]</h2>
  </div>
  <div class="bar-list" style="display:flex;flex-direction:column;gap:28px">
    <div class="bar-row" data-bar="0">
      <div class="bar-row-head" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <span class="bar-label" style="font-size:16px;font-weight:600">[LABEL_1]</span>
        <span class="bar-value" data-target="0" style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">0%</span>
      </div>
      <div class="bar-track" style="position:relative;height:8px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden">
        <div class="bar-fill" data-target="0" style="position:absolute;inset:0 100% 0 0;border-radius:4px"></div>
      </div>
    </div>
    <div class="bar-row" data-bar="1">
      <div class="bar-row-head" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <span class="bar-label" style="font-size:16px;font-weight:600">[LABEL_2]</span>
        <span class="bar-value" data-target="0" style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">0%</span>
      </div>
      <div class="bar-track" style="position:relative;height:8px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden">
        <div class="bar-fill" data-target="0" style="position:absolute;inset:0 100% 0 0;border-radius:4px"></div>
      </div>
    </div>
    <div class="bar-row" data-bar="2">
      <div class="bar-row-head" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <span class="bar-label" style="font-size:16px;font-weight:600">[LABEL_3]</span>
        <span class="bar-value" data-target="0" style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">0%</span>
      </div>
      <div class="bar-track" style="position:relative;height:8px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden">
        <div class="bar-fill" data-target="0" style="position:absolute;inset:0 100% 0 0;border-radius:4px"></div>
      </div>
    </div>
    <div class="bar-row" data-bar="3">
      <div class="bar-row-head" style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <span class="bar-label" style="font-size:16px;font-weight:600">[LABEL_4]</span>
        <span class="bar-value" data-target="0" style="font-size:16px;font-weight:700;font-variant-numeric:tabular-nums">0%</span>
      </div>
      <div class="bar-track" style="position:relative;height:8px;background:rgba(0,0,0,0.08);border-radius:4px;overflow:hidden">
        <div class="bar-fill" data-target="0" style="position:absolute;inset:0 100% 0 0;border-radius:4px"></div>
      </div>
    </div>
  </div>
</section>

<style>
@media (prefers-reduced-motion: reduce) {
  .bar-fill { right: 0 !important; transition: none !important; }
}
</style>

<script>
gsap.registerPlugin(ScrollTrigger);
const root = document.querySelector('.bar-section');
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

root.querySelectorAll('.bar-row').forEach(row => {
  const fill = row.querySelector('.bar-fill');
  const value = row.querySelector('.bar-value');
  const target = parseFloat(fill.dataset.target);
  if (prefersReducedMotion || !Number.isFinite(target)) {
    fill.style.right = Math.max(0, 100 - target) + '%';
    value.textContent = Math.round(target) + '%';
    return;
  }
  ScrollTrigger.create({
    trigger: row,
    start: 'top 85%',
    onEnter: () => {
      gsap.to(fill, { right: (100 - target) + '%', duration: 1.4, ease: 'power3.out' });
      gsap.to({ val: 0 }, {
        val: target, duration: 1.4, ease: 'power3.out',
        onUpdate() { value.textContent = Math.round(this.targets()[0].val) + '%'; }
      });
    },
    once: true,
  });
});
</script>
