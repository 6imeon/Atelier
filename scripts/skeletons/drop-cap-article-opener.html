<!-- DROP CAP ARTICLE OPENER: Oversized serif drop-cap leading a long-form article paragraph -->
<!-- Pattern: Editorial article start — huge initial letter, body wraps elegantly; section metadata row above -->
<!-- Requires: CSS only -->
<!-- Ref: https://www.newyorker.com/ -->
<!-- Ref: https://www.theverge.com/ -->
<!-- Ref: https://www.vanityfair.com/ -->

<section class="dcao-section" style="position:relative;padding:140px 40px;max-width:780px;margin:0 auto">
  <header class="dcao-head" style="margin-bottom:60px;border-top:1px solid currentColor;padding-top:32px">
    <div class="dcao-meta" style="display:flex;gap:24px;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;margin-bottom:32px;opacity:0.65">
      <span class="dcao-eyebrow" data-eyebrow="optional">[EYEBROW]</span>
      <span class="dcao-date">[DATE]</span>
      <span class="dcao-author">[AUTHOR]</span>
    </div>
    <h1 class="dcao-title" style="font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,6vw,84px);font-weight:700;line-height:1.02;letter-spacing:-0.02em;margin:0">[HEADLINE]</h1>
    <p class="dcao-deck" style="font-size:clamp(18px,1.6vw,22px);line-height:1.5;margin:32px 0 0;opacity:0.75;max-width:620px">[DECK]</p>
  </header>

  <article class="dcao-body" style="font-family:Georgia,'Times New Roman',serif;font-size:clamp(17px,1.4vw,20px);line-height:1.65">
    <p class="dcao-first" data-dropcap="true" style="margin:0 0 24px">
      <span class="dcao-cap" aria-hidden="true" style="float:left;font-size:clamp(80px,12vw,180px);font-weight:700;line-height:0.82;margin:6px 12px -4px 0;letter-spacing:-0.04em">[DROP_LETTER]</span>
      [FIRST_PARAGRAPH]
    </p>
    <p style="margin:0 0 24px">[SECOND_PARAGRAPH]</p>
    <p style="margin:0 0 24px">[THIRD_PARAGRAPH]</p>
  </article>
</section>

<style>
.dcao-section .dcao-cap::after { content: ""; display: block; clear: both; }
@media (max-width: 600px) {
  .dcao-section .dcao-cap { font-size: clamp(64px, 18vw, 120px) !important; }
}
</style>
