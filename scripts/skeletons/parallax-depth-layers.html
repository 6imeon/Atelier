<!-- PARALLAX DEPTH LAYERS: Multi-plane scroll with foreground/mid/background moving at different rates -->
<!-- Pattern: Pinned hero with 3 vertically-stacked background layers; each moves at different scroll speed -->
<!-- Requires: GSAP + ScrollTrigger -->
<!-- Ref: https://www.apple.com/airpods-pro/ -->
<!-- Ref: https://www.awwwards.com/ -->
<!-- Ref: https://www.rivian.com/ -->

<section class="pdl-section" style="position:relative;height:200vh">
  <div class="pdl-sticky" style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#fff">
    <div class="pdl-layer pdl-back" data-layer="back" data-speed="0.2" style="position:absolute;inset:-10% 0;background-size:cover;background-position:center;z-index:1;will-change:transform"></div>
    <div class="pdl-layer pdl-mid" data-layer="mid" data-speed="0.5" style="position:absolute;inset:-10% 0;background-size:cover;background-position:center;z-index:2;will-change:transform;opacity:0.85"></div>
    <div class="pdl-scrim" aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.2) 0%,transparent 40%,rgba(0,0,0,0.65) 100%);z-index:3"></div>
    <div class="pdl-content" data-layer="fore" data-speed="0.8" style="position:relative;z-index:4;text-align:center;max-width:900px;padding:0 6vw;will-change:transform">
      <span class="pdl-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;opacity:0.85">[EYEBROW]</span>
      <h1 class="pdl-title" style="font-size:clamp(48px,10vw,160px);font-weight:900;letter-spacing:-0.03em;line-height:0.95;margin:20px 0 0">[HEADLINE]</h1>
      <p class="pdl-body" style="font-size:clamp(16px,1.4vw,20px);line-height:1.55;margin:32px auto 0;max-width:540px;opacity:0.88">[BODY]</p>
    </div>
  </div>
</section>

<style>
@media (prefers-reduced-motion: reduce) {
  .pdl-section { height: auto !important; }
  .pdl-sticky { position: static !important; height: 70vh !important; }
  .pdl-section .pdl-layer, .pdl-section .pdl-content { transform: none !important; }
}
</style>

<script>
gsap.registerPlugin(ScrollTrigger);
const pdlRoot = document.querySelector('.pdl-section');
const pdlPrefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!pdlPrefersReduced) {
  pdlRoot.querySelectorAll('[data-layer]').forEach(el => {
    const speed = parseFloat(el.dataset.speed || '0.5');
    const range = 200 * (1 - speed);
    gsap.fromTo(el,
      { yPercent: -range * 0.5 },
      {
        yPercent: range * 0.5,
        ease: 'none',
        scrollTrigger: {
          trigger: pdlRoot,
          start: 'top bottom',
          end: 'bottom top',
          scrub: 0.8,
        }
      }
    );
  });
}
</script>
