<!-- LETTER REVEAL SCROLL: Scroll-scrubbed letter-by-letter hero headline reveal -->
<!-- Pattern: Pinned hero; each character in headline staggered in on scroll progress -->
<!-- Requires: GSAP + ScrollTrigger -->
<!-- Ref: https://www.apple.com/watch/ -->
<!-- Ref: https://www.rivian.com/ -->
<!-- Ref: https://www.tesla.com/ -->

<section class="lrs-section" style="position:relative;height:250vh">
  <div class="lrs-sticky" style="position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px">
    <span class="lrs-eyebrow" data-eyebrow="optional" style="font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;opacity:0.65;margin-bottom:32px">[EYEBROW]</span>
    <h1 class="lrs-title" data-split="true" data-text="[HEADLINE]" style="font-size:clamp(56px,13vw,220px);font-weight:900;letter-spacing:-0.04em;line-height:0.9;margin:0;text-align:center;max-width:1400px">
      <span class="lrs-line" aria-hidden="true">[HEADLINE]</span>
    </h1>
    <p class="lrs-body" style="font-size:clamp(16px,1.4vw,20px);line-height:1.6;margin:48px auto 0;max-width:560px;text-align:center;opacity:0.7">[BODY]</p>
  </div>
</section>

<style>
.lrs-section .lrs-char { display: inline-block; opacity: 0; transform: translateY(60%); will-change: opacity, transform; }
.lrs-section .lrs-char.is-space { width: 0.28em; }
@media (prefers-reduced-motion: reduce) {
  .lrs-section { height: auto !important; }
  .lrs-sticky { position: static !important; height: auto !important; padding: 120px 40px !important; }
  .lrs-section .lrs-char { opacity: 1 !important; transform: none !important; }
}
</style>

<script>
gsap.registerPlugin(ScrollTrigger);
const lrsRoot = document.querySelector('.lrs-section');
const lrsEl = lrsRoot.querySelector('.lrs-title');
const lrsText = (lrsEl.dataset.text || lrsEl.textContent || '').trim();
const lrsPrefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

lrsEl.innerHTML = '';
const lrsChars = [];
for (const ch of lrsText) {
  const span = document.createElement('span');
  span.className = 'lrs-char' + (ch === ' ' ? ' is-space' : '');
  span.textContent = ch === ' ' ? '\u00a0' : ch;
  lrsEl.appendChild(span);
  lrsChars.push(span);
}

if (!lrsPrefersReduced) {
  gsap.to(lrsChars, {
    opacity: 1,
    y: 0,
    ease: 'power2.out',
    stagger: { each: 0.02, from: 'start' },
    scrollTrigger: {
      trigger: lrsRoot,
      start: 'top top',
      end: 'bottom bottom',
      scrub: 0.6,
    }
  });
} else {
  lrsChars.forEach(c => { c.style.opacity = '1'; c.style.transform = 'none'; });
}
</script>
