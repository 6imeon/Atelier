<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Atelier</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* App chrome is always dark. data-theme controls generated content only. */
      :root {
        /* Chrome (always dark) */
        --chrome-bg: #1b1b1f;
        --chrome-surface: #232327;
        --chrome-border: rgba(255,255,255,0.08);
        --chrome-text: #e4e4e7;
        --chrome-text-secondary: #a1a1aa;
        --chrome-text-muted: #71717a;
        --chrome-text-placeholder: #52525b;
        --chrome-hover: rgba(255,255,255,0.05);
        --chrome-active: rgba(255,255,255,0.08);

        /* Canvas */
        --canvas-bg: #111113;
        --dot-grid: rgba(255,255,255,0.08);

        /* Accent */
        --accent: #818cf8;
        --accent-hover: #6366f1;
        --accent-bg: rgba(129,140,248,0.12);
        --accent-text: #a5b4fc;

        /* Shadows */
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      }

      /* Generated content theme (for design panel preview) */
      [data-theme="light"] { --content-bg: #ffffff; --content-text: #1d1d1f; }
      [data-theme="dark"] { --content-bg: #1c1c1e; --content-text: #f5f5f7; }

      body { background: var(--canvas-bg); color: var(--chrome-text); font-family: 'Inter', system-ui, -apple-system, sans-serif; overflow: hidden; }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes typing { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(400%); } }
      @keyframes shimmerBg { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      @keyframes progressGrow { 0% { width: 5%; } 20% { width: 25%; } 50% { width: 45%; } 80% { width: 70%; } 95% { width: 88%; } 100% { width: 92%; } }
      .canvas-dot-grid { background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
